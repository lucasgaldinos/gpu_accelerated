# JIRA Synchronization Configuration
# Configuration for syncing JIRA PT project with local task management

[jira]
cloud_id = 15a92a49-b55c-4fe9-b50b-65ab6e3d3074
project_key = PT
base_url = https://this-shall-not-be-taken.atlassian.net
board_id = 67

[sync]
tasks_file = project_management/tasks/TASKS.md
backup_before_sync = true
auto_sync_interval = 3600  # seconds (1 hour)

[validation]
require_acceptance_criteria = true
require_labels = true
require_parent_for_tasks = true

[formatting]
date_format = %Y-%m-%d
datetime_format = %Y-%m-%dT%H:%M:%S%z
table_max_summary_length = 50