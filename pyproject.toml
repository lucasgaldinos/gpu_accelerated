[project]
name = "gpu-accelerated"
version = "0.1.0"
description = "GPU-accelerated TSP/VRP optimization with modular architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=6.30.1",
    "ipympl>=0.9.7",
    "jupyterlab>=4.4.7",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.11.6",
    "marimo>=0.16.1",
    "matplotlib>=3.10.6",
    "nbformat>=5.10.4",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "pymupdf4llm>=0.0.27",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=12.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code/src"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
