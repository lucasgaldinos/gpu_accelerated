# Pre-commit hooks for GPU TSP project
# Install with: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: mixed-line-ending
      - id: requirements-txt-fixer

  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # Custom hooks for project-specific enforcement
  - repo: local
    hooks:
      # Enforce snake_case directory naming
      - id: check-directory-naming
        name: Check directory naming convention
        entry: python scripts/validate_naming.py --check-directories
        language: python
        types: [python]
        pass_filenames: false
        always_run: true

      # Enforce file organization
      - id: check-file-organization
        name: Check file organization
        entry: python scripts/validate_structure.py
        language: python
        types: [python]
        pass_filenames: false
        always_run: true

      # Validate TCC academic standards
      - id: check-academic-standards
        name: Check academic standards compliance
        entry: python scripts/validate_academic.py
        language: python
        files: '^(documentation|research|knowledge_base)/.*\.(md|tex|bib)$'
        pass_filenames: true

      # Ensure proper imports and architecture
      - id: check-architecture
        name: Check hexagonal architecture compliance
        entry: python scripts/validate_architecture.py
        language: python
        files: '^code/.*\.py$'
        pass_filenames: true